<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" shape-rendering="crispEdges" opacity=".8">
  <!-- Carritos pixel dando vueltas al circuito del fondo (mismo trazado que bg-circuit.svg) -->
