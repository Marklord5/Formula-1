    <symbol id="car" viewBox="0 0 16 8" width="16" height="8"><rect x="0" y="0" width="4" height="1" fill="currentColor"/><rect x="1" y="1" width="1" height="1" fill="currentColor"/><rect x="8" y="1" width="2" height="1" fill="#fff"/><rect x="1" y="2" width="1" height="1" fill="currentColor"/><rect x="6" y="2" width="6" height="1" fill="currentColor"/><rect x="1" y="3" width="13" height="1" fill="currentColor"/><rect x="0" y="4" width="16" height="1" fill="currentColor"/><rect x="1" y="5" width="3" height="1" fill="#07090D"/><rect x="11" y="5" width="3" height="1" fill="#07090D"/><rect x="0" y="6" width="2" height="1" fill="#07090D"/><rect x="2" y="6" width="1" height="1" fill="#C9CED8"/><rect x="3" y="6" width="2" height="1" fill="#07090D"/><rect x="10" y="6" width="2" height="1" fill="#07090D"/><rect x="12" y="6" width="1" height="1" fill="#C9CED8"/><rect x="13" y="6" width="2" height="1" fill="#07090D"/><rect x="1" y="7" width="3" height="1" fill="#07090D"/><rect x="11" y="7" width="3" height="1" fill="#07090D"/></symbol>
  </defs>
  <g color="#E10600" transform="scale(1.9) translate(-8 -4)">
